<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gen Z Hub Admin</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="admin-body">

<div class="admin-container">

<h1>🎬 Add New Drama</h1>
<p>Add complete drama information</p>

<div class="form-grid">

<input id="title" placeholder="Drama Title">

<input id="category" placeholder="Category (K-Drama, C-Drama, Anime, Movie)">

<input id="rating" placeholder="Rating (9.5)">

<input id="image" placeholder="Image URL">

<input id="year" placeholder="Year">

<input id="episodes" placeholder="Episodes">

<input id="genre" placeholder="Genre">

<input id="status" placeholder="Status (Completed / Ongoing)">

<input id="country" placeholder="Country">

<input id="director" placeholder="Director">

<input id="cast" placeholder="Cast">

<textarea id="desc" placeholder="Short Description"></textarea>

<textarea id="about" placeholder="Full Story / About Drama"></textarea>

</div>

<button class="glow-btn" onclick="addDrama()">
➕ Add Drama
</button>

<br><br>

<a href="index.html" class="back-btn">
🏠 Back To Home
</a>

</div>

<script src="admin.js"></script>

</body>
</html>
