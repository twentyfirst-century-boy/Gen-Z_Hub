<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gen Z Hub - Admin</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="admin-body">

<div class="admin-container">

<h1>🎬 Add New Content</h1>
<p>Fill details to add movie / drama</p>

<div class="form-grid">

<div class="input-box">
<input id="title" type="text" required>
<label>Title</label>
</div>

<div class="input-box">
<input id="category" type="text" required>
<label>Category (Movie / K-Drama)</label>
</div>

<div class="input-box">
<input id="rating" type="text" required>
<label>Rating (9.5)</label>
</div>

<div class="input-box">
<input id="image" type="text" required>
<label>Image URL</label>
</div>

<div class="input-box textarea-box">
<textarea id="desc" required></textarea>
<label>Description</label>
</div>

</div>

<button class="glow-btn" onclick="addDrama()">
➕ Add to Gen Z Hub
</button>

</div>

<script src="admin.js"></script>

</body>
</html>
