<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gen Z Hub</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- LOADER -->
<div id="loader">
<h1>Gen Z Hub</h1>
<p>Loading...</p>
</div>

<!-- NAVBAR -->
<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-film"></i>
<span>Gen Z Hub</span>
</div>

<!-- SEARCH -->
<div class="search-box">
<input type="text" id="search" placeholder="Search Movies & Dramas...">
<i class="fa-solid fa-magnifying-glass"></i>
</div>

<!-- ADMIN BUTTON -->
<a href="admin.html" class="add-btn">
➕ Add
</a>

<!-- FILTER MENU -->
<div class="menu">

<button class="menu-btn active" data-filter="all">All</button>
<button class="menu-btn" data-filter="Movie">Movies</button>
<button class="menu-btn" data-filter="K-Drama">K-Drama</button>
<button class="menu-btn" data-filter="C-Drama">C-Drama</button>
<button class="menu-btn" data-filter="Anime">Anime</button>

</div>

</nav>

<!-- HERO -->
<section class="hero">

<div class="overlay">

<h1>
Welcome to <span>Gen Z Hub</span>
</h1>

<p>Discover Amazing Movies, Dramas & Anime</p>

<a href="#trending">
<button>Explore Now</button>
</a>

</div>

</section>

<!-- TRENDING -->
<section id="trending" class="section">

<div class="section-title">🔥 Trending</div>
<div class="cards" id="trendingList"></div>

</section>

<!-- LATEST -->
<section class="section">

<div class="section-title">🆕 Latest</div>
<div class="cards" id="latestList"></div>

</section>

<!-- TOP -->
<section class="section">

<div class="section-title">⭐ Top Rated</div>
<div class="cards" id="topList"></div>

</section>

<!-- FOOTER -->
<footer>

<h2>Gen Z Hub</h2>
<p>Watch • Discover • Explore</p>
<p>Made with ❤️</p>

</footer>

<!-- BACK TO TOP -->
<button id="topBtn">
<i class="fa-solid fa-arrow-up"></i>
</button>

<!-- SCRIPTS (IMPORTANT ORDER) -->
<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
