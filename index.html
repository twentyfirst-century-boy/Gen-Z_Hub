<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gen Z Hub</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Loading Screen -->
<div id="loader">
<h1>Gen Z Hub</h1>
<p>Loading...</p>
</div>

<!-- Navbar -->
<nav class="navbar">

<div class="logo">
<i class="fa-solid fa-film"></i>
<span>Gen Z Hub</span>
</div>

<div class="search-box">

<input type="text" id="search" placeholder="Search Movies & Dramas...">

<i class="fa-solid fa-magnifying-glass"></i>

</div>

<!-- 🔥 NEW: ADMIN BUTTON -->
<div style="display:flex;align-items:center;gap:10px;">

<a href="admin.html">
<button style="
padding:8px 15px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#4f7cff,#a855f7);
color:white;
cursor:pointer;
">
➕ Add
</button>
</a>

</div>

<div class="menu">

<button class="menu-btn active" data-filter="all">All</button>
<button class="menu-btn" data-filter="Movie">Movies</button>
<button class="menu-btn" data-filter="K-Drama">K-Drama</button>
<button class="menu-btn" data-filter="C-Drama">C-Drama</button>
<button class="menu-btn" data-filter="Anime">Anime</button>

</div>

</nav>

<!-- Hero -->
<section class="hero">

<div class="overlay">

<h1>
Welcome to <span>Gen Z Hub</span>
</h1>

<p>
Discover Amazing Movies, Dramas & Anime
</p>

<a href="#trending">
<button>Explore Now</button>
</a>

</div>

</section>

<!-- Trending -->
<section id="trending" class="section">

<div class="section-title">🔥 Trending</div>

<div class="cards" id="trendingList"></div>

</section>

<!-- Latest -->
<section class="section">

<div class="section-title">🆕 Latest</div>

<div class="cards" id="latestList"></div>

</section>

<!-- Top Rated -->
<section class="section">

<div class="section-title">⭐ Top Rated</div>

<div class="cards" id="topList"></div>

</section>

<!-- Footer -->
<footer>

<h2>Gen Z Hub</h2>

<p>Watch • Discover • Explore</p>
<p>Made with ❤️</p>

</footer>

<!-- Back To Top -->
<button id="topBtn">
<i class="fa-solid fa-arrow-up"></i>
</button>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
